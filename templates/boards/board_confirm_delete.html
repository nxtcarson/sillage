{% extends "base.html" %}
{% block page_title %}Delete Board{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="card p-6">
    <div class="flex items-start gap-4 mb-6">
      <div class="w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center shrink-0">
        <svg class="w-5 h-5 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100 mb-1">Delete board</h2>
        <p class="text-sm text-slate-500">Are you sure you want to delete <strong class="text-slate-700 dark:text-slate-300">{{ board.name }}</strong>? All columns and cards will be permanently removed.</p>
      </div>
    </div>
    <form method="post" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="btn-danger">Delete permanently</button>
      <a href="{% url 'board_detail' board.pk %}" class="btn-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
