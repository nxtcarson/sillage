<div class="card p-3 cursor-move hover:shadow-md transition-shadow group select-none" data-lead-id="{{ lead.pk }}">
  <div class="flex items-start justify-between gap-2">
    <a href="{% url 'contact_detail' lead.contact.pk %}" class="text-sm font-medium text-slate-800 dark:text-slate-200 hover:text-brand-600 dark:hover:text-brand-400 transition-colors leading-snug cursor-pointer" onclick="event.stopPropagation()">{{ lead.contact.full_name }}</a>
    {% if lead.value %}
    <span class="text-xs font-semibold text-green-600 dark:text-green-400 shrink-0">${{ lead.value }}</span>
    {% endif %}
  </div>
  {% if lead.contact.email %}
  <p class="text-xs text-slate-400 mt-0.5 truncate">{{ lead.contact.email }}</p>
  {% endif %}
  {% if lead.expected_close %}
  <p class="text-xs text-slate-400 mt-1.5 flex items-center gap-1">
    <svg class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25"/></svg>
    {{ lead.expected_close }}
  </p>
  {% endif %}
</div>
