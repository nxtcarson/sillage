{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function(){
      var t=localStorage.getItem('theme');
      if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))
        document.documentElement.classList.add('dark');
      else if(t==='light') document.documentElement.classList.remove('dark');
    })();
  </script>
  <title>{% block title %}Sillage{% endblock %}</title>
  <link rel="icon" href="{% static 'img/sillage-logo.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"></noscript>
  <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
  <link href="{% static 'css/output.css' %}" rel="stylesheet">
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-sans antialiased">
  {% block content %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
