{% extends "base.html" %}
{% block page_title %}Company{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="card p-6">
    <h2 class="text-base font-semibold text-slate-900 dark:text-slate-100 mb-6">Company settings</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="name" class="form-label">Company name</label>
        <input type="text" id="name" name="name" value="{{ org.name }}" required placeholder="Your company name">
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
